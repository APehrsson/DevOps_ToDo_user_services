apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-management-service-deployment
  labels:
    app: user-management-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-management-service
  template:
    metadata:
      labels:
        app: user-management-service
    spec:
      containers:
      - name: user-management-service
        image: your-docker-repo/user-management-service:latest  # Replace with your Docker image
        ports:
        - containerPort: 3001
        env:
        - name: MONGO_URL
          value: "mongodb://mongo-service:27017/users"  # MongoDB connection string
